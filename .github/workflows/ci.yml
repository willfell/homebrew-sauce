name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  formula:
    runs-on: ${{ vars.CI_HOSTED_LABEL || 'ubuntu-24.04-arm' }}
    timeout-minutes: 10
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - name: Provide build tools for native gems
        run: |
          set -euo pipefail
          if ! command -v g++ >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq build-essential
          fi
      - name: Install Homebrew if missing
        run: |
          set -euo pipefail
          if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            NONINTERACTIVE=1 bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
      - name: Audit and fetch the formula
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap willfell/sauce "$PWD"
          brew audit --online --skip-style willfell/sauce/sauce
          brew fetch --force willfell/sauce/sauce
  lint:
    uses: willfell/wac.lab.actions/.github/workflows/actionlint.yml@v1.18.0
    with:
      runner: ${{ vars.CI_HOSTED_LABEL || 'ubuntu-24.04-arm' }}
      runner_policy: fleet
    permissions:
      contents: read
